<form [formGroup]="loginForm" id="form" (ngSubmit)="login()">
  <div>
    <label for="email" class="block text-surface-900 dark:text-surface-0 text-xl font-medium mb-2">
      Email
    </label>

    <input
      pInputText
      id="email"
      type="text"
      placeholder="Email address"
      class="w-full md:w-120 mb-8"
      formControlName="email"
      autocomplete="off"
    />

    <label for="password" class="block text-surface-900 dark:text-surface-0 font-medium text-xl mb-2">
      Password
    </label>

    <p-password
      id="password"
      formControlName="password"
      placeholder="Password"
      [toggleMask]="true"
      class="mb-4"
      [fluid]="true"
      [feedback]="false"
      autocomplete="off"
    ></p-password>

    <p-button id="btnLogin" label="Login" styleClass="w-full" type="submit"></p-button>
  </div>
</form>
