<ion-header>
  <ion-toolbar color="dark">
    <ion-title>OS Manager - Mecânica</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <form [formGroup]="form" (ngSubmit)="entrar()" class="max-w-md mx-auto mt-10">
    <ion-item class="mb-4">
      <ion-label position="floating">Mecânico (Login)</ion-label>
      <ion-input formControlName="login" type="text"></ion-input>
    </ion-item>
    <ion-item class="mb-6">
      <ion-label position="floating">Senha de Acesso</ion-label>
      <ion-input formControlName="password" type="password"></ion-input>
    </ion-item>
    <ion-button expand="block" type="submit" [disabled]="form.invalid">Autenticar Crachá</ion-button>
  </form>
</ion-content>


<h1>TESTE</h1>
